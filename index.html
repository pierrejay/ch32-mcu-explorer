<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCH RISC-V MCU Explorer</title>
  <meta name="description" content="Per-part-number specifications of WCH RISC-V microcontrollers: search, parametric filtering and side-by-side comparison. Sourced from vendor datasheets.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('wch.theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="WCH RISC-V MCU Explorer — home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="3"/><path d="M11 2v5m5-5v5m5-5v5M11 25v5m5-5v5m5-5v5M2 11h5m-5 5h5m-5 5h5M25 11h5m-5 5h5m-5 5h5"/></svg>
      <span class="brand-text"><b>WCH RISC-V</b> MCU Explorer</span>
    </a>
    <div class="gsearch" role="combobox" aria-haspopup="listbox" aria-owns="gsearch-list">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="gsearch" type="search" placeholder="Part number, family, core…" autocomplete="off" spellcheck="false" aria-label="Find a part" aria-autocomplete="list" aria-controls="gsearch-list">
      <kbd>/</kbd>
      <ul id="gsearch-list" role="listbox" hidden></ul>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#/" data-nav="browse">Browse</a>
      <a href="#/compare" data-nav="compare">Compare <span class="badge" id="cmp-count" hidden></span></a>
      <a href="#/about" data-nav="about">Data</a>
    </nav>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
  </header>
  <main id="view" tabindex="-1"><p class="boot">Loading…</p></main>
  <div id="tray" class="tray" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="boot">This page needs JavaScript (no network access required).</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
